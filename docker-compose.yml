services:
  clarity-video:
    build: .
    container_name: clarity-video
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - CHROME_BIN=/usr/bin/chromium
      # VPS: render to /tmp, upload to R2, then delete local files.
      # Override in .env with CLARITY_ENV=local to keep outputs on disk.
      - CLARITY_ENV=${CLARITY_ENV:-vps}
      - KEEP_LOCAL_OUTPUTS=${KEEP_LOCAL_OUTPUTS:-false}
    # Do NOT bind-mount ./outputs on VPS — that fills the host disk.
    # Jobs use /tmp/clarity-jobs and are wiped after R2 upload.
    restart: unless-stopped
